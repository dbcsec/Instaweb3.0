<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instaweb Agency — Customer Acquisition Engine</title>
  <meta name="description" content="A custom website for local pros. $399 setup + $99/mo care. Optional local leads and AI receptionist add-ons.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0B0F19;
      color: #F9FAFB;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .wrap {
      max-width: 640px;
      width: 100%;
    }
    h1 {
      font-size: clamp(1.9rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    h1 .accent {
      background: linear-gradient(135deg, #6366F1, #10B981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subline {
      font-size: 1.15rem;
      color: #9CA3AF;
      margin-bottom: 28px;
    }
    .price {
      font-size: 1.05rem;
      color: #E5E7EB;
      margin-bottom: 10px;
    }
    .price strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .price.secondary {
      margin-bottom: 28px;
    }
    .cta {
      display: inline-block;
      background: linear-gradient(135deg, #4F46E5, #3730A3);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 1.05rem;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(79, 70, 229, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(79, 70, 229, 0.5);
    }
    .trust {
      font-size: 0.9rem;
      color: #6B7280;
      margin-top: 24px;
    }
    .footer {
      font-size: 0.85rem;
      color: #6B7280;
      margin-top: 56px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Custom Website = <span class="accent">Customer Acquisition Engine</span></h1>
    <p class="subline">A custom website for local pros. Setup + monthly care. Optional add-ons.</p>
    <p class="price">Setup &amp; Launch <strong>$399</strong> &middot; Site Care <strong>$99/mo</strong></p>
    <p class="price secondary">Add Local Leads <strong>$99/mo</strong> or everything for <strong>$249/mo</strong></p>
    <a class="cta" href="mailto:hello@instaweb.agency?subject=Get%20my%20business%20online%20today">Email us — get online today</a>
    <p class="trust">Site built and live in 7 days.</p>
    <p class="footer">Instaweb Agency</p>
  </div>
</body>
</html>
