<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instaweb Caller — Lead Queue</title>
<meta name="description" content="Phone lead queue for Instaweb Agency. Filter, sort, call, and track verified local business leads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --primary: #4F46E5; --primary-light: #6366F1; --primary-dark: #3730A3;
  --primary-glow: rgba(79,70,229,0.12); --secondary: #F59E0B;
  --accent: #10B981; --accent-glow: rgba(16,185,129,0.12);
  --dark: #0B0F19; --dark-2: #111827; --dark-3: #1F2937;
  --light: #F9FAFB; --gray-400: #9CA3AF; --gray-500: #6B7280;
  --white: #FFFFFF; --border: rgba(255,255,255,0.06);
  --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  --radius: 14px; --radius-sm: 10px;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-body); background:var(--dark); color:var(--light); line-height:1.5; padding-bottom:100px; }
.container { max-width:700px; margin:0 auto; padding:0 16px; }
.gradient-text { background:linear-gradient(135deg,var(--primary-light),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

/* NAV */
.nav { position:sticky; top:0; z-index:100; padding:12px 16px; background:rgba(11,15,25,0.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.nav-logo { display:flex; align-items:center; gap:10px; color:var(--white); text-decoration:none; }
.nav-logo .mark { width:34px; height:34px; background:linear-gradient(135deg,var(--primary),var(--primary-light)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--white); font-family:var(--font-display); font-weight:700; }
.nav-logo .text { font-family:var(--font-display); font-size:18px; font-weight:700; letter-spacing:-1px; }
.nav-logo .text span { background:linear-gradient(135deg,var(--secondary),#F97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.nav-title { margin-left:auto; font-size:12px; color:var(--gray-400); font-weight:500; background:rgba(255,255,255,0.04); padding:4px 12px; border-radius:20px; }

/* STATS */
.stats { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:10px 16px; background:var(--dark-2); border-bottom:1px solid var(--border); }
.stat { text-align:center; padding:8px 4px; }
.stat b { display:block; font-family:var(--font-display); font-size:20px; color:var(--secondary); }
.stat span { font-size:10px; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.5px; }

/* FILTERS */
.filters { padding:10px 16px; display:flex; gap:6px; flex-wrap:wrap; background:var(--dark-2); border-bottom:1px solid var(--border); position:sticky; top:56px; z-index:99; }
.filters select, .filters input { padding:8px 12px; background:var(--dark); border:1px solid var(--border); border-radius:8px; color:var(--light); font-size:13px; font-family:var(--font-body); outline:none; }
.filters select:focus, .filters input:focus { border-color:var(--primary-light); }
.filters .btn-next { margin-left:auto; padding:8px 16px; background:linear-gradient(135deg,var(--accent),#059669); color:#fff; border:none; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; }
.filters .btn-next:hover { box-shadow:0 4px 15px rgba(16,185,129,0.3); }

/* LEAD CARD */
#leads { padding:8px 16px; }
.lead-card { background:var(--dark-2); border-radius:var(--radius); padding:14px; margin-bottom:8px; border:1px solid var(--border); cursor:pointer; transition:all .2s; position:relative; }
.lead-card:hover { border-color:rgba(79,70,229,0.3); }
.lead-card.priority { border-color:rgba(245,158,11,0.4); background:linear-gradient(135deg,rgba(245,158,11,0.03),var(--dark-2)); }
.lead-card.priority::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--secondary); border-radius:4px 0 0 4px; }
.lead-card .name { font-size:15px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
.lead-card .send-note { position:absolute; top:12px; right:14px; font-size:11px; color:var(--gray-400); font-weight:500; letter-spacing:0.2px; }
.lead-card .info { font-size:12px; color:var(--gray-400); margin-bottom:6px; display:flex; gap:16px; flex-wrap:wrap; }
.lead-card .badges { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
.badge { padding:3px 8px; border-radius:4px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.badge-called { background:#059669; color:#fff; }
.badge-voicemail { background:var(--secondary); color:var(--dark); }
.badge-no-answer { background:#6B7280; color:#fff; }
.badge-callback { background:var(--primary-light); color:#fff; }
.badge-no { background:#dc2626; color:#fff; }
.badge-new { background:rgba(255,255,255,0.06); color:var(--gray-400); }
.badge-emailed { background:rgba(99,102,241,0.2); color:var(--primary-light); }
.badge-industry { background:rgba(79,70,229,0.1); color:var(--primary-light); }
.badge-rank { background:var(--secondary); color:var(--dark); }
.lead-card .actions { display:flex; gap:6px; margin-top:10px; }
.actions a, .actions button { flex:1; padding:9px 6px; border-radius:8px; font-size:12px; font-weight:600; text-align:center; text-decoration:none; border:none; cursor:pointer; font-family:var(--font-body); transition:all .2s; }
.btn-call { background:var(--accent); color:#fff; }
.btn-call:hover { background:#059669; }
.btn-email { background:var(--primary); color:#fff; }
.btn-email:hover { background:var(--primary-dark); }
.btn-preview { background:var(--dark); color:var(--secondary); border:1px solid var(--border); }
.btn-status { background:var(--dark); color:var(--gray-400); border:1px solid var(--border); }

/* STATUS QUICK BUTTONS */
.quick-status { display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }
.quick-status button { padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid var(--border); background:var(--dark); color:var(--gray-400); cursor:pointer; font-family:var(--font-body); transition:all .15s; }
.quick-status button:hover { border-color:var(--primary-light); color:var(--light); }
.quick-status button.active { border-color:var(--accent); background:rgba(16,185,129,0.1); color:var(--accent); }

/* DETAIL OVERLAY */
.detail-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--dark); z-index:200; overflow-y:auto; }
.detail-overlay.on { display:block; }
.detail-header { padding:16px; display:flex; justify-content:space-between; align-items:start; border-bottom:1px solid var(--border); background:var(--dark-2); }
.detail-header h2 { font-family:var(--font-display); font-size:20px; }
.detail-header .sub { color:var(--gray-400); font-size:13px; margin-top:4px; }
.detail-body { padding:16px; }
.detail-body label { display:block; font-size:12px; font-weight:600; color:var(--gray-400); margin:12px 0 4px; text-transform:uppercase; letter-spacing:0.5px; }
.detail-body input, .detail-body textarea, .detail-body select { width:100%; padding:10px; background:var(--dark-2); border:1px solid var(--border); border-radius:8px; color:var(--light); font-size:14px; font-family:var(--font-body); outline:none; }
.detail-body textarea { min-height:80px; resize:vertical; }
.detail-body select option { background:var(--dark-2); color:var(--light); }
.detail-actions { display:flex; gap:8px; padding:16px; background:var(--dark-2); border-top:1px solid var(--border); position:sticky; bottom:0; }
.btn-primary { flex:1; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-weight:700; font-size:15px; cursor:pointer; font-family:var(--font-body); }
.btn-secondary { flex:1; padding:14px; background:var(--dark-3); color:var(--gray-400); border:none; border-radius:var(--radius-sm); font-weight:600; font-size:15px; cursor:pointer; font-family:var(--font-body); }
.btn-call-big { display:block; text-align:center; padding:14px; background:var(--accent); color:#fff; border-radius:var(--radius-sm); font-weight:700; font-size:15px; text-decoration:none; margin-bottom:12px; }

/* SCRIPT TAB */
.script-card { background:var(--dark-2); border-radius:var(--radius); border:1px solid var(--border); margin-bottom:8px; overflow:hidden; }
.script-header { padding:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:600; font-size:14px; }
.script-header .arrow { color:var(--gray-500); transition:transform .2s; }
.script-header.open .arrow { transform:rotate(180deg); }
.script-body { display:none; padding:0 14px 14px; font-size:13px; color:var(--gray-400); line-height:1.7; }
.script-body.open { display:block; }

.empty-state { text-align:center; padding:60px 20px; color:var(--gray-500); }
.empty-state i { font-size:40px; margin-bottom:16px; display:block; color:var(--gray-500); }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">
    <div class="mark">I</div>
    <div class="text">Insta<span>web</span></div>
  </a>
  <div class="nav-title">Caller · Lead Queue</div>
</nav>

<div id="api-status" style="text-align:center;padding:4px 16px;font-size:13px;color:#fbbf24;background:#1a1a2e;border-bottom:1px solid #333;">⏳ Loading leads...</div>
  <div class="stats" id="stats">
  <div class="stat"><b id="st">0</b><span>Total</span></div>
  <div class="stat"><b id="sp">0</b><span>Phones</span></div>
  <div class="stat"><b id="se">0</b><span>Emails</span></div>
  <div class="stat"><b id="sc">0</b><span>Called</span></div>
  <div class="stat"><b id="snext">0</b><span>Priority</span></div>
</div>

<div class="filters">
  <select id="filterIndustry" onchange="draw()" style="width:130px;">
    <option value="">All Industries</option>
    <option value="hvac">HVAC</option>
    <option value="plumbing">Plumbing</option>
    <option value="roofing">Roofing</option>
    <option value="electrical">Electrical</option>
    <option value="restaurant">Restaurant</option>
  </select>
  <select id="sortBy" onchange="draw()" style="width:130px;">
    <option value="email-first" selected>Email First</option>
    <option value="priority">Priority</option>
    <option value="">Default</option>
    <option value="city">By City</option>
    <option value="name">By Name</option>
    <option value="industry">By Industry</option>
  </select>
  <input id="q" placeholder="Search..." oninput="draw()" style="flex:1;min-width:120px;">
  <button class="btn-next" onclick="callNext()"><i class="fas fa-phone"></i> Call Next</button>
</div>

<nav class="filters" style="top:110px;border-top:none;">
  <button class="tab on" onclick="showTab('leads',this)">📞 Leads</button>
  <button class="tab" onclick="showTab('top10',this)" style="background:var(--dark);border:1px solid var(--secondary);color:var(--secondary);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-body);">🎯 Top 10</button>
  <button class="tab" onclick="showTab('script',this)" style="background:var(--dark);border:1px solid var(--border);color:var(--gray-400);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);">📄 Script</button>
  <button class="tab" onclick="showTab('acw',this)" style="background:var(--dark);border:1px solid var(--border);color:var(--gray-400);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);">📝 Notes · ACW</button>
</nav>

<div id="leads">
  <div id="l"></div>
</div>

<div id="top10" style="display:none;padding:8px 16px;">
  <div id="l10"></div>
</div>

<div id="script" style="display:none;padding:0 16px;" class="container"></div>

<div id="acw" style="display:none;padding:0 16px;" class="container"></div>

<div class="detail-overlay" id="detail">
  <div class="detail-header">
    <div>
      <h2 id="det-name"></h2>
      <div class="sub" id="det-sub"></div>
    </div>
    <button onclick="closeDetail()" style="background:var(--dark-3);color:var(--gray-400);border:none;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;">✕</button>
  </div>
  <div class="detail-body">
    <a class="btn-call-big" id="det-call" href=""><i class="fas fa-phone"></i> Call Now</a>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <a id="det-preview" href="" target="_blank" style="flex:1;padding:12px;text-align:center;background:var(--dark-2);color:var(--secondary);border:1px solid var(--border);border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;">👁 Preview Site</a>
      <a id="det-email-link" href="" style="flex:1;padding:12px;text-align:center;background:var(--dark-2);color:var(--primary-light);border:1px solid var(--border);border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;">✉ Email</a>
    </div>
    <label>Contact Name</label>
    <input id="det-contact" placeholder="Who you spoke to?">
    <label>Status</label>
    <select id="det-status">
      <option value="">— Not called yet —</option>
      <option value="answered">📞 Answered</option>
      <option value="interested">💰 Interested</option>
      <option value="voicemail">📞 Left Voicemail</option>
      <option value="no-answer">📵 No Answer</option>
      <option value="callback">🔄 Callback Scheduled</option>
      <option value="email-captured">📧 Email Captured</option>
      <option value="not-interested">❌ Not Interested</option>
    </select>
    <label>After Call Notes (ACW)</label>
    <textarea id="det-notes" placeholder="Who you spoke to, what they said, follow-up promised, payment link sent..."></textarea>
  </div>
  <div class="detail-actions">
    <button class="btn-primary" onclick="saveDetail()">💾 Save</button>
    <button class="btn-secondary" onclick="closeDetail()">Cancel</button>
  </div>
</div>

<script>
let D=[],C=JSON.parse(localStorage.getItem('contacts')||'{}'),curId='';

// Top-10 phone-campaign leads (owner-first) — in call-sheet order 1-10 (top10_call_sheet.md)
const TOP10 = [
  'Mondragon Mechanical LLC',
  'Jade Air, LLC',
  'Smart Air Cooling & Heating',
  'Strand Brothers Service Experts',
  'Fort Worth Air Conditioning Co. Inc.',
  'Webb Air Heating & Cooling',
  'Bob Heinmiller Air Conditioning Inc',
  'Cowboys Air Conditioning & Heating',
  'Texas AirZone LLC',
  'Lawrence Air Conditioning & Heating'
];
function normName(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function top10Lead(name){
  // Prefer the record that has a demo_url (duplicate pool records may lack it); else first match
  let nn = normName(name);
  let matches = D.filter(l => normName(l.business_name) === nn);
  return matches.find(l => l.demo_url) || matches[0] || null;
}

async function init(){
  var statusEl = document.getElementById('api-status');
  try {
    // Use absolute www URL (non-www 308 redirects can fail in some browsers)
    // Fetch first to get total count, then fetch all leads
    var countResp = await fetch('https://www.instaweb.agency/api/caller/leads?limit=1&_=' + Date.now());
    var totalNeeded = 828; // fallback
    if (countResp.ok) {
      var countData = await countResp.json();
      totalNeeded = countData.total || 828;
    }
    var resp = await fetch('https://www.instaweb.agency/api/caller/leads?limit=' + totalNeeded + '&_=' + Date.now());
    if (resp.ok) {
      var data = await resp.json();
      D = (data.leads || []).map(function(l) {
        return {
          business_name: l.business_name || '',
          phone: l.phone || '',
          city: l.city || '',
          state: l.state || '',
          industry: l.industry || '',
          email: l.email || '',
          demo_url: l.demo_url || '',
          emailed: !!l.emailed,
          email_sent_at: l.email_sent_at || '',
          email_sent_a: l.email_sent_a || '',
          email_sent_b: l.email_sent_b || '',
          email_sent_c: l.email_sent_c || ''
        };
      });
      if (statusEl) {
        statusEl.textContent = '✅ API OK — ' + D.length + ' of ' + totalNeeded + ' leads loaded';
        statusEl.style.color = '#4ade80';
      }
    } else {
      if (statusEl) {
        statusEl.textContent = '❌ API error: HTTP ' + resp.status;
        statusEl.style.color = '#ef4444';
      }
      console.error('API returned', resp.status);
    }
  } catch(e) {
    if (statusEl) {
      statusEl.textContent = '❌ API fetch failed: ' + (e.message || 'network error');
      statusEl.style.color = '#ef4444';
    }
    console.error('API fetch failed:', e);
  }
  updateStats();
  draw();
  renderTop10();
  renderScript();
}

function sortLeads(arr, sort){
  if(sort==='city') return [...arr].sort((a,b)=>(a.city||'').localeCompare(b.city||''));
  if(sort==='name') return [...arr].sort((a,b)=>(a.business_name||'').localeCompare(b.business_name||''));
  if(sort==='industry') return [...arr].sort((a,b)=>(a.industry||'').localeCompare(b.industry||''));
  if(sort==='priority' || sort==='email-first') {
    const P = {hvac:0, roofing:1, plumbing:2, electrical:3, restaurant:4};
    return [...arr].sort((a,b)=>{
      if(sort==='email-first'){
        let ea = (a.email||'').trim() ? 0 : 1;
        let eb = (b.email||'').trim() ? 0 : 1;
        if(ea!==eb) return ea-eb;
      }
      let pa = P[(a.industry||'').toLowerCase()] ?? 9;
      let pb = P[(b.industry||'').toLowerCase()] ?? 9;
      if(pa!==pb) return pa-pb;
      let da = a.demo_url ? 0 : 1, db = b.demo_url ? 0 : 1;
      if(da!==db) return da-db;
      return (a.business_name||'').localeCompare(b.business_name||'');
    });
  }
  return arr;
}

function getNextUncalled(){
  // Priority: email-havers first, then industry priority order, then not called, has phone
  let sorted = sortLeads(D, 'email-first');
  for(let l of sorted){
    if(!l.phone) continue;
    let id=(l.business_name||'')+'|'+(l.phone||'');
    let c=C[id]||{};
    if(!c.status) return l;
  }
  return sorted.find(l => l.phone && !(C[(l.business_name||'')+'|'+(l.phone||'')]||{}).status) || sorted.find(l=>l.phone);
}

function callNext(){
  let next = getNextUncalled();
  if(!next) { alert('All leads called!'); return; }
  let id=(next.business_name||'')+'|'+(next.phone||'');
  openDetail(id);
  window.scrollTo(0,0);
}

function updateStats(){
  document.getElementById('st').textContent = D.length;
  document.getElementById('sp').textContent = D.filter(l=>l.phone).length;
  document.getElementById('se').textContent = D.filter(l=>l.email).length;
  let called = Object.values(C).filter(c=>c.status).length;
  document.getElementById('sc').textContent = called;
  let uncalled = D.filter(l=>l.phone&&!(C[(l.business_name||'')+'|'+(l.phone||'')]||{}).status).length;
  document.getElementById('snext').textContent = uncalled;
}

// Render the right-aligned "A/B/C email sent" note for a lead's send history.
// A=1st, B=2nd, C=final send date (MM/DD). Only slots that exist are shown.
function sendNoteHTML(l){
  var parts = [];
  if (l.emailed) {
    if (l.email_sent_a) parts.push('A ' + mmdd(l.email_sent_a));
    if (l.email_sent_b) parts.push('B ' + mmdd(l.email_sent_b));
    if (l.email_sent_c && l.email_sent_c !== l.email_sent_a) parts.push('C ' + mmdd(l.email_sent_c));
  }
  if (!parts.length) return '';
  return '<div class="send-note" title="Email send dates (A=first, B=second, C=final)">✉️ ' + parts.join(' · ') + '</div>';
}
function mmdd(iso){
  var s = (iso||'').replace(/[^0-9-]/g,'').slice(0,10);
  if (!s) return '';
  var p = s.split('-');
  if (p.length===3 && p[1] && p[2]) return p[1] + '/' + p[2];
  return s;
}
function leadCardHTML(l, isPriority, rank){
  let id=(l.business_name||'')+'|'+(l.phone||'');
  let c=C[id]||{};
  let badges = '';
  let statusLabel = '';
  if(c.status==='interested'||c.status==='called') { badges+='<span class="badge badge-called">💰 Interested</span>'; statusLabel='Interested'; }
  else if(c.status==='answered') { badges+='<span class="badge badge-called">✅ Answered</span>'; statusLabel='Answered'; }
  else if(c.status==='voicemail') { badges+='<span class="badge badge-voicemail">📞 Voicemail</span>'; statusLabel='Voicemail'; }
  else if(c.status==='no-answer') { badges+='<span class="badge badge-no-answer">📵 No Answer</span>'; statusLabel='No answer'; }
  else if(c.status==='callback') { badges+='<span class="badge badge-callback">🔄 Callback</span>'; statusLabel='Callback'; }
  else if(c.status==='no'||c.status==='not-interested') { badges+='<span class="badge badge-no">❌ Not interested</span>'; statusLabel='Not interested'; }
  else if(c.status==='email-captured') { badges+='<span class="badge badge-emailed">📧 Email</span>'; statusLabel='Email captured'; }
  else if(l.emailed) { badges+='<span class="badge badge-emailed">📧 Emailed</span>'; }
  else { badges+='<span class="badge badge-new">✦ New</span>'; }
  badges += '<span class="badge badge-industry">'+(l.industry||'?').toUpperCase()+'</span>';
  let priorityClass = isPriority ? ' priority' : '';
  let h='';
  h+='<div class="lead-card'+priorityClass+'" id="card-'+id.replace(/[^a-z0-9]/gi,'')+'">';
  h+=sendNoteHTML(l);
  h+='<div class="name">'+(rank?'<span class="badge badge-rank">'+rank+'</span> ':'')+(c.contact||l.business_name||'Unnamed')+'</div>';
  if(c.contact) h+='<div class="name" style="font-size:12px;color:var(--gray-400);font-weight:400;">'+l.business_name+'</div>';
  h+='<div class="info"><span><i class="fas fa-phone"></i> '+(l.phone||'No phone')+'</span><span><i class="fas fa-map-pin"></i> '+(l.city||'')+' '+(l.state||'')+'</span></div>';
  h+='<div class="badges">'+badges+'</div>';
  h+='<div class="quick-status">';
  h+='<button class="'+(c.status==='answered'?'active':'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'answered\')" title="Answered">📞</button>';
  h+='<button class="'+(c.status==='interested'?'active':'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'interested\')" title="Interested">💰</button>';
  h+='<button class="'+(c.status==='voicemail'?'active':'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'voicemail\')" title="Voicemail">📻</button>';
  h+='<button class="'+(c.status==='no-answer'?'active':'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'no-answer\')" title="No Answer">📵</button>';
  h+='<button class="'+(c.status==='email-captured'?'active':'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'email-captured\')" title="Email captured">📧</button>';
  h+='<button class="'+(c.status==='callback'?'active':'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'callback\')" title="Callback">🔄</button>';
  h+='<button class="'+(c.status==='not-interested'?'active':'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'not-interested\')" title="Not interested">❌</button>';
  if(c.notes) h+='<button onclick="event.stopPropagation()" style="color:var(--accent);">📝</button>';
  h+='</div>';
  h+='<div class="actions">';
  h+='<a class="btn-call" href="tel:'+(l.phone||'')+'" onclick="event.stopPropagation();quickStatus(\''+id.replace(/'/g,"\\'")+'\',\'answered\')"><i class="fas fa-phone"></i> Call</a>';
  if(l.email) h+='<a class="btn-email" href="mailto:'+l.email+'" onclick="event.stopPropagation()"><i class="fas fa-envelope"></i> Email</a>';
  if(l.demo_url) h+='<a class="btn-preview" href="'+l.demo_url+'" target="_blank" onclick="event.stopPropagation()"><i class="fas fa-eye"></i> Preview</a>';
  h+='<button class="btn-status" onclick="event.stopPropagation();openDetail(\''+id.replace(/'/g,"\\'")+'\')"><i class="fas fa-pen"></i> Notes</button>';
  h+='</div></div>';
  return h;
}

function draw(){
  let ind = document.getElementById('filterIndustry').value;
  let sort = document.getElementById('sortBy').value;
  let q = (document.getElementById('q').value||'').toLowerCase();
  let filtered = D.filter(l =>
    (!ind || (l.industry||'').toLowerCase().includes(ind)) &&
    (!q || (l.business_name||'').toLowerCase().includes(q) || (l.city||'').toLowerCase().includes(q) || (l.phone||'').includes(q))
  );
  let sorted = sortLeads(filtered, sort);
  let nextUncalled = getNextUncalled();
  let h = '';
  for(let l of sorted){
    let isPriority = l.phone && nextUncalled && (l.business_name===nextUncalled.business_name && l.phone===nextUncalled.phone);
    h += leadCardHTML(l, isPriority);
  }
  document.getElementById('l').innerHTML = h || '<div class="empty-state"><i class="fas fa-inbox"></i><p>No leads match your filters</p></div>';
  updateStats();
}

function renderTop10(){
  let h='';
  for(let i=0;i<TOP10.length;i++){
    let l = top10Lead(TOP10[i]);
    if(!l){ h+='<div class="lead-card"><div class="name"><span class="badge badge-rank">'+(i+1)+'</span> '+TOP10[i]+'</div><div class="info">Not in loaded queue</div></div>'; continue; }
    h += leadCardHTML(l, false, i+1);
  }
  document.getElementById('l10').innerHTML = h || '<div class="empty-state"><i class="fas fa-inbox"></i><p>No top-10 leads loaded</p></div>';
}

function quickStatus(id, status){
  let c=C[id]||{};
  c.status = c.status===status ? '' : status;
  C[id]=c;
  localStorage.setItem('contacts',JSON.stringify(C));
  draw();
  renderTop10();
}

function openDetail(id){
  curId=id;
  let parts=id.split('|');
  let lead=D.find(l=>(l.business_name||'')+(l.phone||'')===parts[0]+parts[1])||{};
  let c=C[id]||{};
  document.getElementById('det-name').textContent=lead.business_name||'Unknown';
  document.getElementById('det-sub').textContent=(lead.phone||'')+' · '+(lead.city||'')+' '+(lead.state||'')+' · '+(lead.industry||'');
  document.getElementById('det-call').href='tel:'+(lead.phone||'');
  document.getElementById('det-preview').href=lead.demo_url||'#';
  document.getElementById('det-email-link').href=lead.email?'mailto:'+lead.email:'#';
  document.getElementById('det-contact').value=c.contact||'';
  document.getElementById('det-status').value=c.status||'';
  document.getElementById('det-notes').value=c.notes||'';
  document.getElementById('detail').classList.add('on');
}

function saveDetail(){
  if(!curId) return;
  let c=C[curId]||{};
  c.contact=document.getElementById('det-contact').value;
  c.status=document.getElementById('det-status').value;
  c.notes=document.getElementById('det-notes').value;
  C[curId]=c;
  localStorage.setItem('contacts',JSON.stringify(C));
  closeDetail();
  draw();
  renderTop10();
  // Export + sync
  let lines=[];
  for(let id in C){ let co=C[id]; if(!co.status&&!co.notes&&!co.contact) continue; let p=id.split('|'); lines.push({business:p[0],phone:p[1],contact:co.contact||'',status:co.status||'',notes:co.notes||'',time:new Date().toISOString()}); }
  let blob=new Blob([JSON.stringify(lines,null,2)],{type:'application/json'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='instaweb_call_log.json'; a.click(); URL.revokeObjectURL(a.href);
  fetch('/api/sync-calls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lines)}).catch(()=>{});
}

function closeDetail(){ document.getElementById('detail').classList.remove('on'); }

function showTab(id,el){
  document.querySelectorAll('.filters .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('leads').style.display = id==='leads'?'block':'none';
  document.getElementById('top10').style.display = id==='top10'?'block':'none';
  document.getElementById('script').style.display = id==='script'?'block':'none';
  document.getElementById('acw').style.display = id==='acw'?'block':'none';
  if(id==='top10') renderTop10();
}
